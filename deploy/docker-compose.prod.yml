# =========================================================
# Setlog - Production stack
# Chạy: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# =========================================================
services:

  # --------- Backend REST API (Node/Express + Sequelize) ---------
  # Repo: thư mục gốc, entry src/app.js
  backend:
    image: ${REGISTRY}/setlog-backend:${IMAGE_TAG:-latest}
    build:
      context: ..                # gốc repo (chứa Dockerfile, src/, package.json)
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "4000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [setlog-net]

  # --------- Realtime/Media service (Socket.io + node-cron + media) ---------
  # Repo: thư mục backend/, entry app.js
  realtime:
    image: ${REGISTRY}/setlog-realtime:${IMAGE_TAG:-latest}
    build:
      context: ../backend       # thư mục backend/ (chứa backend/Dockerfile, app.js)
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "5000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [setlog-net]

  # --------- Database (MySQL) ---------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [setlog-net]

  # --------- Redis (rate-limit + socket.io adapter + cache) ---------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [setlog-net]

  # --------- Nginx reverse proxy (TLS + rate limit) ---------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/setlog.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - realtime
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [setlog-net]

volumes:
  mysql-data:
  redis-data:

networks:
  setlog-net:
    driver: bridge
