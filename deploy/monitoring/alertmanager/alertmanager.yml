# Setlog - Alertmanager config (gửi cảnh báo về Slack)
global:
  resolve_timeout: 5m

route:
  receiver: slack-default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: slack-critical
      repeat_interval: 1h

receivers:
  - name: slack-default
    slack_configs:
      - api_url: ${SLACK_WEBHOOK}
        channel: "#setlog-alerts"
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}• {{ .Annotations.description }}\n{{ end }}"

  - name: slack-critical
    slack_configs:
      - api_url: ${SLACK_WEBHOOK}
        channel: "#setlog-alerts"
        send_resolved: true
        title: "🚨 [CRITICAL] {{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}• {{ .Annotations.description }}\n{{ end }}"
