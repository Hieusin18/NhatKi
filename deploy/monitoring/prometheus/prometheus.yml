# Setlog - Prometheus config
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Nạp file rule cảnh báo
rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Backend Express expose /metrics (prom-client) - xem README phần instrument
  - job_name: setlog-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:4000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
