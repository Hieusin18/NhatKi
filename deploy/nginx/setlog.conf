# =========================================================
# Setlog - Nginx reverse proxy (production)
# Định tuyến đúng theo route thật của repo:
#   /socket.io/, /api/v1/media   -> realtime (Socket.io + media, cổng 5000)
#   /auth /diary /feed /tags /groups /capsules /health /metrics -> backend REST (cổng 4000)
# =========================================================

# Giới hạn request: 10 req/s mỗi IP, burst 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream setlog_api {
    server backend:4000;
    keepalive 32;
}

upstream setlog_realtime {
    server realtime:5000;
    keepalive 32;
}

# ---- HTTP: redirect sang HTTPS ----
server {
    listen 80;
    server_name api.setlog.app;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    server_name api.setlog.app;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;

    client_max_body_size 50m;   # upload media

    # ---- WebSocket (Socket.io) -> service realtime ----
    location /socket.io/ {
        proxy_pass http://setlog_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ---- Media upload -> service realtime ----
    location /api/v1/media/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://setlog_realtime;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Healthcheck (không rate limit) ----
    location = /health {
        proxy_pass http://setlog_api/health;
        access_log off;
    }

    # ---- Chặn /metrics khỏi truy cập public (chỉ Prometheus nội bộ scrape) ----
    location = /metrics { return 403; }

    # ---- REST API (auth/diary/feed/tags/groups/capsules...) -> backend ----
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://setlog_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
